<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Rock Paper Scissor Game</title>
</head>
<body>

    <h1>Rock Paper Scissors</h1>

    <div class="choices">
        <div class="choice" id="rock">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSCT_5Yyw0O0aZUWOQ8cGttsRLrRa-cOzmLnT5IKH4lVCc2UrRAYBQw820y&s=10" width="200px">
        </div>
        <div class="choice" id="paper">
            <img src="https://github.com/shradha-khapra/JavaScriptSeries/blob/main/StonePaperScissors/images/paper.png?raw=true" width="200">
        </div>
        <div class="choice" id="Scissor">
            <img src="https://github.com/shradha-khapra/JavaScriptSeries/blob/main/StonePaperScissors/images/scissors.png?raw=true" width="200px">
        </div>
    </div>

    <div class="score-board">
        <div class="userScore">
            <div id="score-you">0</div>
            <div>You</div>
        </div>
        <div class="compScore">
            <div id="score-comp">0</div>
            <div>Comp</div>
        </div>
       
    </div>

    <div id="resultBtn">Pick your move</div>
    <script src="script.js"></script>
</body>
</html>
